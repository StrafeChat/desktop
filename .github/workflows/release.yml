# Builds and signs the desktop app for every platform and publishes a draft GitHub release
# with the installers plus latest.json, the manifest the in-app updater reads from
# https://github.com/StrafeChat/desktop/releases/latest/download/latest.json.
#
# Trigger: push a tag `v<version>` where <version> matches package.json. Publish the draft
# once the installers have been tried; the updater only sees published releases. The web
# client is the `web/` submodule: bump it to the commit a release should carry first.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (the contents of the key generated with
# `npx tauri signer generate`) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if the key
# has none). The matching public key is in src-tauri/tauri.conf.json; an installed app
# only accepts updates signed by it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS slices are built on the arm64 runner.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # The last three are what the bundled GStreamer's webrtc plugins link against; the
          # runner has no gstreamer packages of its own to pull them in, and the AppImage
          # bundler stops when a dependency is missing.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libsrtp2-1 libvpx7 libopus0

      # Calls need a web engine with WebRTC, which no distribution ships, and a GStreamer
      # new enough to go with it. scripts/build-webrtc-stack.sh builds both (plus a libnice
      # that does not drag in libsoup2) for this exact runner; the tarball is laid over /usr
      # here, so the bundler picks it up the way it would the stock libraries.
      - name: WebRTC web engine
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBRTC_STACK_TAG: webrtc-stack-2.50.4
        run: |
          set -euo pipefail
          installed="$(dpkg-query -W -f='${Version}' libwebkit2gtk-4.1-0)"
          case "$installed" in
            2.50.4-*) ;;
            *) echo "runner has libwebkit2gtk-4.1 $installed, the WebRTC stack is 2.50.4 - rebuild it with scripts/build-webrtc-stack.sh"; exit 1 ;;
          esac
          gh release download "$WEBRTC_STACK_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'webrtc-stack-*-ubuntu22.04-x86_64.tar.xz' --dir /tmp/webrtc-stack
          sudo tar -C / -xJf /tmp/webrtc-stack/webrtc-stack-*-ubuntu22.04-x86_64.tar.xz
          sudo ldconfig
          # Prove it took: only a WebRTC build links GStreamer's webrtc library.
          ldd /usr/lib/x86_64-linux-gnu/libwebkit2gtk-4.1.so.0 | grep -q libgstwebrtc || { echo "WebRTC engine not in place"; exit 1; }
          test -f /usr/lib/x86_64-linux-gnu/gstreamer-1.0/libgstwebrtc.so || { echo "GStreamer webrtc plugin missing"; exit 1; }

      - run: npm ci && npm ci --prefix web

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          # linuxdeploy says nothing useful unless the bundler is verbose, and the Linux
          # bundle is the one carrying a hand-built web engine.
          args: ${{ matrix.args }} --verbose
          tagName: v__VERSION__
          releaseName: 'Strafe Desktop v__VERSION__'
          releaseBody: 'Installers for Windows, macOS and Linux are below. Installed copies update themselves.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
